[project]
name = "mcml-reporting"
version = "0.1.0"
description = "Unified MCML reporting pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sim @ git+https://github.com/m-a-r-o-u/sim.git",
  "slurm-cli @ git+https://github.com/m-a-r-o-u/slurm.git",
]

[project.scripts]
mcml-report = "mcml_reporting.cli:main"

[tool.uv]
package = true
